run_name: dam-offset-genalm-s42
collator: dam_offset

model_name: AIRI-Institute/gena-lm-bert-base-t2t
model_class: AutoModel          # GENA-LM maps its pre-LN MaskedLM to AutoModel only
dataset_path: training/dataset_genalm
output_dir: training/checkpoints/dam-offset-genalm-s42

# D2 pay-off test (GENA-LM backbone). Identical to config_mlm_genalm.yaml except
# the collator — the only difference between the two arms is the masking distribution.
num_train_epochs: 20
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
learning_rate: 2.0e-5
warmup_ratio: 0.1
weight_decay: 0.01
lr_scheduler_type: cosine

eval_strategy: epoch
save_strategy: epoch
save_total_limit: 1
load_best_model_at_end: true
metric_for_best_model: eval_loss

# DAM knobs (offset-aware collator): standard linear mapping, 0.15 rescale.
scale_to: 0.15
power: 1.0
smooth: 0

seed: 42
dataloader_num_workers: 0
logging_steps: 10
report_to: none
