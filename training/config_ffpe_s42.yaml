run_name: ffpe-s42
collator: position
profile_path: damage/synthetic/ffpe.npy

model_name: zhihan1996/DNABERT-2-117M
dataset_path: training/dataset
output_dir: training/checkpoints/ffpe-s42

# D3 synthetic REAL-domain leg: DAM matched to the near-uniform FFPE deamination profile

# (clinical FFPE, a real non-aDNA domain). Uniform-MLM arm reused from mlm-baseline-s*.
num_train_epochs: 20
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
learning_rate: 2.0e-5
warmup_ratio: 0.1
weight_decay: 0.01
lr_scheduler_type: cosine

eval_strategy: epoch
save_strategy: epoch
save_total_limit: 1
load_best_model_at_end: true
metric_for_best_model: eval_loss

scale_to: 0.15

seed: 42
dataloader_num_workers: 0
logging_steps: 10
report_to: none
